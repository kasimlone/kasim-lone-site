<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0f1419"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.15" r="0.8">
      <stop offset="0%" stop-color="#82AAFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#82AAFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.9" r="0.7">
      <stop offset="0%" stop-color="#FFCB6B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFCB6B" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }
      .kw { fill: #82AAFF; }
      .str { fill: #C3E88D; }
      .fn { fill: #FFCB6B; }
      .const { fill: #F78C6C; }
      .comment { fill: #546E7A; }
      .text { fill: #A6ACCD; }
      .ink { fill: #f4f4f5; }
      .dim { fill: #71717a; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow)"/>
  <rect width="640" height="360" fill="url(#glow2)"/>

  <!-- Faint diagonal binary rain -->
  <g class="mono" font-size="10" opacity="0.14" fill="#82AAFF">
    <text x="20" y="30">10110100 01001101 11010011</text>
    <text x="20" y="50">01101110 10011010 00110101</text>
    <text x="20" y="70">11001010 01101101 10101010</text>
    <text x="200" y="300">10011010 01001101</text>
    <text x="230" y="320">11010011 00110101</text>
    <text x="260" y="340">01001010 10110101</text>
  </g>

  <!-- Title block -->
  <text x="42" y="120" class="mono kw" font-size="12" font-weight="600">// OCR GCSE · Computer Science</text>
  <text x="42" y="165" class="mono ink" font-size="34" font-weight="700">Data Representation</text>

  <!-- Subtitle: string -->
  <text x="42" y="195" class="mono str" font-size="14">"binary · hex · characters · images · sound"</text>

  <!-- Pixel grid (bottom-left) representing an image -->
  <g transform="translate(42, 245)">
    <g fill="#82AAFF">
      <rect x="0"  y="0"  width="12" height="12" opacity="0.9"/>
      <rect x="14" y="0"  width="12" height="12" opacity="0.6"/>
      <rect x="28" y="0"  width="12" height="12" opacity="0.35"/>
      <rect x="42" y="0"  width="12" height="12" opacity="0.15"/>
    </g>
    <g fill="#C3E88D">
      <rect x="0"  y="14" width="12" height="12" opacity="0.85"/>
      <rect x="14" y="14" width="12" height="12" opacity="0.55"/>
      <rect x="28" y="14" width="12" height="12" opacity="0.3"/>
      <rect x="42" y="14" width="12" height="12" opacity="0.1"/>
    </g>
    <g fill="#FFCB6B">
      <rect x="0"  y="28" width="12" height="12" opacity="0.8"/>
      <rect x="14" y="28" width="12" height="12" opacity="0.5"/>
      <rect x="28" y="28" width="12" height="12" opacity="0.25"/>
      <rect x="42" y="28" width="12" height="12" opacity="0.1"/>
    </g>
    <g fill="#F78C6C">
      <rect x="0"  y="42" width="12" height="12" opacity="0.75"/>
      <rect x="14" y="42" width="12" height="12" opacity="0.45"/>
      <rect x="28" y="42" width="12" height="12" opacity="0.2"/>
      <rect x="42" y="42" width="12" height="12" opacity="0.08"/>
    </g>
    <text x="70" y="16" class="mono dim" font-size="10">pixels</text>
    <text x="70" y="30" class="mono dim" font-size="10">colour</text>
    <text x="70" y="44" class="mono dim" font-size="10">depth</text>
    <text x="70" y="58" class="mono dim" font-size="10">resolution</text>
  </g>

  <!-- Right side: 8-bit place-value row -->
  <g transform="translate(360, 90)">
    <text x="0" y="0" class="mono comment" font-size="10">// 8-bit binary</text>
    <g class="mono" font-size="11">
      <g>
        <rect x="0"   y="10" width="26" height="26" rx="4" fill="#1a1f2e" stroke="#3f3f46"/>
        <rect x="30"  y="10" width="26" height="26" rx="4" fill="#82AAFF" fill-opacity="0.22" stroke="#82AAFF"/>
        <rect x="60"  y="10" width="26" height="26" rx="4" fill="#1a1f2e" stroke="#3f3f46"/>
        <rect x="90"  y="10" width="26" height="26" rx="4" fill="#82AAFF" fill-opacity="0.22" stroke="#82AAFF"/>
        <rect x="120" y="10" width="26" height="26" rx="4" fill="#82AAFF" fill-opacity="0.22" stroke="#82AAFF"/>
        <rect x="150" y="10" width="26" height="26" rx="4" fill="#1a1f2e" stroke="#3f3f46"/>
        <rect x="180" y="10" width="26" height="26" rx="4" fill="#82AAFF" fill-opacity="0.22" stroke="#82AAFF"/>
        <rect x="210" y="10" width="26" height="26" rx="4" fill="#1a1f2e" stroke="#3f3f46"/>
      </g>
      <g class="dim" font-size="8">
        <text x="8"   y="8">128</text>
        <text x="40"  y="8">64</text>
        <text x="70"  y="8">32</text>
        <text x="100" y="8">16</text>
        <text x="132" y="8">8</text>
        <text x="162" y="8">4</text>
        <text x="192" y="8">2</text>
        <text x="222" y="8">1</text>
      </g>
      <g font-weight="700" font-size="13">
        <text x="9"   y="28" fill="#71717a">0</text>
        <text x="39"  y="28" fill="#82AAFF">1</text>
        <text x="69"  y="28" fill="#71717a">0</text>
        <text x="99"  y="28" fill="#82AAFF">1</text>
        <text x="129" y="28" fill="#82AAFF">1</text>
        <text x="159" y="28" fill="#71717a">0</text>
        <text x="189" y="28" fill="#82AAFF">1</text>
        <text x="219" y="28" fill="#71717a">0</text>
      </g>
    </g>
    <text x="0" y="60" class="mono text" font-size="12">= <tspan class="fn" font-weight="700">90</tspan> denary · <tspan class="str" font-weight="700">5A</tspan> hex</text>
  </g>

  <!-- Sound wave (right side, lower) -->
  <g transform="translate(360, 200)">
    <text x="0" y="0" class="mono comment" font-size="10">// sample rate + bit depth</text>
    <path d="M 0 40 Q 30 5 60 40 T 120 40 T 180 40 T 240 40"
          fill="none" stroke="#546E7A" stroke-width="1.6" opacity="0.9"/>
    <!-- stepped digital wave -->
    <path d="M 0 40 L 15 40 L 15 22 L 30 22 L 30 10 L 45 10 L 45 22 L 60 22 L 60 40 L 75 40 L 75 58 L 90 58 L 90 70 L 105 70 L 105 58 L 120 58 L 120 40 L 135 40 L 135 22 L 150 22 L 150 10 L 165 10 L 165 22 L 180 22 L 180 40 L 195 40 L 195 58 L 210 58 L 210 70 L 225 70 L 225 58 L 240 58 L 240 40"
          fill="none" stroke="#82AAFF" stroke-width="1.6" opacity="0.9"/>
    <!-- sample dots -->
    <g fill="#FFCB6B">
      <circle cx="0"   cy="40" r="2.5"/>
      <circle cx="15"  cy="22" r="2.5"/>
      <circle cx="30"  cy="10" r="2.5"/>
      <circle cx="45"  cy="22" r="2.5"/>
      <circle cx="60"  cy="40" r="2.5"/>
      <circle cx="75"  cy="58" r="2.5"/>
      <circle cx="90"  cy="70" r="2.5"/>
      <circle cx="105" cy="58" r="2.5"/>
      <circle cx="120" cy="40" r="2.5"/>
    </g>
  </g>

  <!-- Corner tag -->
  <g transform="translate(560, 320)">
    <rect x="0" y="0" width="60" height="22" rx="4" fill="#82AAFF" fill-opacity="0.15" stroke="#82AAFF" stroke-opacity="0.4"/>
    <text x="30" y="15" class="mono kw" font-size="10" text-anchor="middle" font-weight="600">Paper 1</text>
  </g>
</svg>
